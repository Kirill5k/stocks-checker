api: {
  key: ${?API_KEY}
}

server {
  host: "0.0.0.0"
  host: ${?HOST}
  port: 7070
  port: ${?PORT}
}

clients {
  alpha-vantage {
    base-uri: "https://www.alphavantage.co"
    api-key: "api-key"
    api-key: ${ALPHA_VANTAGE_API_KEY}
  }
  finnhub {
    base-uri: "https://finnhub.io"
    api-key: "api-key"
    api-key: ${FINNHUB_API_KEY}
  }
  twelve-data {
    base-uri: "https://api.twelvedata.com"
    # Comma-separated keys; duplicate keys share one allowance.
    api-key: "api-key"
    api-key: ${TWELVE_DATA_API_KEY}
  }
}

action-executor {
  concurrency: 2
  concurrency: ${?ACTION_EXECUTOR_CONCURRENCY}
}

mongo {
  user: ""
  user: ${?MONGO_USER}
  password: ""
  password: ${?MONGO_PASSWORD}
  host: ""
  host: ${?MONGO_HOST}
  db-name: "stocks-checker"
  connect-timeout = 3 minutes
  read-timeout = 3 minutes
  server-selection-timeout = 3 minutes
}
# Quotas must match the subscriptions; zero daily allowance means no daily cap.
clients.finnhub.limits {
  requests-per-minute = 60
  requests-per-minute = ${?FINNHUB_REQUESTS_PER_MINUTE}
  daily-allowance = 0
  daily-allowance = ${?FINNHUB_DAILY_ALLOWANCE}
  max-concurrent = 2
}
clients.twelve-data.limits {
  # Each distinct API key receives these limits independently.
  requests-per-minute = 8
  requests-per-minute = ${?TWELVE_DATA_REQUESTS_PER_MINUTE}
  daily-allowance = 800
  daily-allowance = ${?TWELVE_DATA_DAILY_ALLOWANCE}
  max-concurrent = 1
}
investment {
  price-freshness-days = 7
  snapshot-freshness-days = 14
  quarterly-freshness-days = 180
  annual-freshness-days = 550
}
